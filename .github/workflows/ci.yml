# Runs every test and builds the standalone bundle for every push to main and every pull
# request. Tests never open real devices: transports, sysfs and systemctl are faked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        # hidapi has no prebuilt wheel for this Python, so pip compiles it.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libusb-1.0-0-dev libudev-dev

      - name: Build the bundle
        # Creates build/venv with the pinned requirements, then dist/photon.
        run: python tools/build_bundle.py

      - name: Test
        run: build/venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke-test the bundle
        run: dist/photon --version

  test-and-build-windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # hidapi publishes a Windows wheel for this Python.
          python-version: '3.12'

      - name: Build the executable
        # Creates build\venv with the pinned requirements, then dist\photon.exe.
        run: python tools/build_bundle.py

      - name: Test
        run: build\venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke-test the executable
        run: dist\photon.exe --version
